name: React CI
on:
  push:
    branches: [main, master]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      enforce-tests:
        description: 'Fail the pipeline when tests fail. Default (false) still RUNS the tests but only reports failures.'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-src-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  security-events: write

jobs:
# ── Build & Test ─────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Test
        id: tests
        run: npx jest --ci --coverage --coverageReporters=json-summary --coverageReporters=text-summary --coverageReporters=lcov --passWithNoTests --reporters=default
        continue-on-error: ${{ github.event.inputs.enforce-tests != 'true' }}
      - name: Report test outcome
        if: always()
        run: |
          MODE=advisory
          if [ "${{ github.event.inputs.enforce-tests }}" = "true" ]; then
            MODE=enforced
          fi
          OUTCOME="${{ steps.tests.outcome }}"
          {
            echo "### Tests: $OUTCOME"
            echo ""
            if [ "$OUTCOME" = "success" ]; then
              echo "All executed tests passed."
            elif [ "$MODE" = "enforced" ]; then
              echo "Tests FAILED and enforce-tests=true, so this pipeline is failing."
            else
              echo "Tests FAILED, but enforce-tests is false so the pipeline is NOT blocked."
              echo "A green check here does NOT mean the tests passed."
              echo "Re-run via 'Run workflow' with enforce-tests=true to make failures blocking."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Test step outcome=$OUTCOME (mode=$MODE)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-src-frontend
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
          const s = require('./coverage/coverage-summary.json');
          const pct = s.total.lines.pct;
          require('fs').appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            '### Test Coverage: ' + pct + '%\\n');
          " 2>/dev/null || true
          else
            true
          fi
      - name: CI Summary
        if: always()
        run: |
          echo '## CI Result' >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }} | Branch: ${{ github.ref_name }} | SHA: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

# ── Dependency Audit (parallel with test) ────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Audit dependencies
        # DevOpsGen: audit-grace-period-until: 2026-11-09
        # Harden by removing continue-on-error after fixing existing issues.
        run: npm audit --audit-level=high
        continue-on-error: true



  trivy-source:
    name: Source Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    outputs:
      grade:    ${{ steps.grade.outputs.grade }}
      critical: ${{ steps.grade.outputs.critical }}
      high:     ${{ steps.grade.outputs.high }}

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy source scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type:      fs
          scan-ref:       ./src/frontend
          format:         sarif
          output:         trivy-results.sarif
          exit-code:      1
          ignore-unfixed: true
          severity:       CRITICAL,HIGH,MEDIUM,LOW
        continue-on-error: true

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref:  ./src/frontend
          format:    cyclonedx
          output:    sbom.cyclonedx.json
        continue-on-error: true

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90
          if-no-files-found: ignore
        continue-on-error: true
    
      - name: Compute grade and write outputs
        id: grade
        if: always()
        run: |
          python3 -c "
          import json, os, sys
          sarif_path = 'trivy-results.sarif'
          critical_ids = []
          if not os.path.exists(sarif_path):
              print('SARIF file not found — defaulting grade to F (fail-closed)')
              g, c, h, m, l = 'F', 0, 0, 0, 0
          else:
              try:
                  data = json.load(open(sarif_path))
              except Exception as exc:
                  print(f'SARIF parse error: {exc} — defaulting grade to F (fail-closed)')
                  g, c, h, m, l = 'F', 0, 0, 0, 0
              else:
                  runs  = data.get('runs', [{}])
                  rules = {r['id']: r
                           for r in runs[0].get('tool',{}).get('driver',{}).get('rules',[])}
                  c = h = m = l = 0
                  for run in runs:
                      for res in run.get('results', []):
                          rule_id = res.get('ruleId', '')
                          sev = (rules.get(rule_id, {})
                                       .get('properties', {})
                                       .get('security-severity', ''))
                          try:    flt = float(sev)
                          except: flt = 0.0
                          if   flt >= 9.0:
                              c += 1
                              if rule_id and len(critical_ids) < 10:
                                  critical_ids.append(rule_id)
                          elif flt >= 7.0: h += 1
                          elif flt >= 4.0: m += 1
                          else:            l += 1
                  # Grade rubric — must stay in sync with _compute_grade() in
                  # analyzer.py and SecurityScanService.computeGrade() in Java
                  if   c >= 5:               g = 'F'
                  elif c >= 3:               g = 'D'
                  elif c >= 1:               g = 'C'
                  elif h > 5 or m > 25:      g = 'C'
                  elif h > 2 or m > 10:      g = 'B'
                  else:                      g = 'A'
          out = os.environ.get('GITHUB_OUTPUT', '')
          if out:
              with open(out, 'a') as fh:
                  fh.write(f'critical={c}\nhigh={h}\nmedium={m}\nlow={l}\ngrade={g}\n')
                  fh.write('critical_cve_ids=' + ','.join(critical_ids) + '\n')
          print(f'Trivy result: C={c} H={h} M={m} L={l} grade={g}')
          "


      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: POST results to DevOpsGen backend
        if: always()
        env:
          SCAN_URL:     ${{ vars.DEVOPSGEN_SCAN_CALLBACK_URL }}
          PROJECT_ID:   ${{ vars.DEVOPSGEN_PROJECT_ID }}
          GRADE:        ${{ steps.grade.outputs.grade }}
          CRITICAL:     ${{ steps.grade.outputs.critical }}
          HIGH:         ${{ steps.grade.outputs.high }}
          MEDIUM:       ${{ steps.grade.outputs.medium }}
          LOW:          ${{ steps.grade.outputs.low }}
          # CIFIX-9: SCAN_REF and CRITICAL_CVE_IDS are interpolated into the
          # JSON payload below but were never exported here, so every
          # CI-originated source-scan callback reached the backend with an
          # empty scanRef (its idempotency/dedup key) and no CVE ids.
          SCAN_REF:     ${{ github.sha }}
          CRITICAL_CVE_IDS: ${{ steps.grade.outputs.critical_cve_ids }}
        run: |
          if [ -z "$SCAN_URL" ]; then
            echo "DEVOPSGEN_SCAN_CALLBACK_URL not set — skipping backend callback"
            exit 0
          fi
          # CIFIX-16: the payload used to be passed as an inline
          # double-quoted -d argument whose inner quotes were NOT escaped
          # for the shell. bash concatenates the adjacent quoted/unquoted
          # runs and strips every one of those quotes, so what actually
          # reached the backend was {projectId:abc,scanType:fs,...} —
          # unquoted keys and values, i.e. not JSON at all, rejected on
          # arrival. A heredoc needs no quote escaping and still expands
          # the environment variables above.
          curl -sf -X POST "$SCAN_URL" -H "Content-Type: application/json" -d @- <<PAYLOAD || echo "Backend callback failed (non-fatal)"
          {"projectId":"$PROJECT_ID","scanType":"fs","critical":${CRITICAL:-0},"high":${HIGH:-0},"medium":${MEDIUM:-0},"low":${LOW:-0},"grade":"${GRADE:-F}","status":"SUCCEEDED","scanRef":"$SCAN_REF","origin":"ci","criticalCveIds":"$CRITICAL_CVE_IDS"}
          PAYLOAD

# ── Test Report Annotations (TENT-2) ─────────────────────────────────────────
  test-report:
    name: Test Report
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download JUnit results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: junit-results-*
          path: junit-artifacts
          merge-multiple: true
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Test Results
          path: 'junit-artifacts/**/junit.xml'
          reporter: jest-junit
          fail-on-error: false
          fail-on-empty: false
